<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="boxBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3E6BFF"/>
      <stop offset="1" stop-color="#1730B0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- speed lines glow: soft, behind everything -->
  <g stroke="#BFE0FF" stroke-linecap="round" fill="none" opacity="0.6" filter="url(#glow)">
    <line x1="70" y1="266" x2="180" y2="266" stroke-width="24"/>
    <line x1="40" y1="290" x2="190" y2="290" stroke-width="28"/>
    <line x1="55" y1="312" x2="185" y2="312" stroke-width="28"/>
    <line x1="20" y1="334" x2="195" y2="334" stroke-width="34"/>
    <line x1="50" y1="356" x2="180" y2="356" stroke-width="28"/>
    <line x1="80" y1="378" x2="170" y2="378" stroke-width="24"/>
  </g>

  <!-- speed lines: rounded solid bars, fanned out, concentrated in the bottom half -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none">
    <line x1="70" y1="266" x2="180" y2="266" stroke-width="24"/>
    <line x1="40" y1="290" x2="190" y2="290" stroke-width="28"/>
    <line x1="55" y1="312" x2="185" y2="312" stroke-width="28"/>
    <line x1="20" y1="334" x2="195" y2="334" stroke-width="34"/>
    <line x1="50" y1="356" x2="180" y2="356" stroke-width="28"/>
    <line x1="80" y1="378" x2="170" y2="378" stroke-width="24"/>
  </g>

  <!-- main skewed box + play triangle, shifted right so speed lines have room -->
  <g transform="translate(276 256) skewX(-18) translate(-276 -256)">
    <rect x="106" y="86" width="340" height="340" rx="76" fill="url(#boxBlue)"/>
    <polygon fill="#FFFFFF" points="238,181 238,331 368,256"/>
  </g>
</svg>
